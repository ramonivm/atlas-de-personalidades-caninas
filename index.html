<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/assets/fabiconlight.webp" />
    <link rel="preload" href="/assets/fabiconlight.webp" as="image" type="image/webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Critical Pre-load & Anti-FOUC inline styles -->
    <style>
      html, body {
        background-color: #0a0a0a;
        color: #ededed;
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #initial-loader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0a0a0a;
        color: #ededed;
        gap: 16px;
      }
      .atlas-pulse-logo {
        width: 52px;
        height: 52px;
        border-radius: 16px;
        box-shadow: 0 0 24px rgba(245, 158, 11, 0.15);
      }
      .atlas-spinner {
        width: 32px;
        height: 32px;
        border: 2.5px solid rgba(245, 158, 11, 0.18);
        border-top-color: #f59e0b;
        border-radius: 50%;
        animation: atlas-spin 0.75s linear infinite;
      }
      .atlas-loading-text {
        font-size: 13px;
        font-weight: 600;
        color: #a3a3a3;
        letter-spacing: -0.01em;
      }
      @keyframes atlas-spin {
        to { transform: rotate(360deg); }
      }
    </style>

    <!-- SEO Primary Meta Tags -->
    <title>AtlasCanino - Diccionario Etológico y Mapa Mental de Razas Caninas</title>
    <meta name="title" content="AtlasCanino - Diccionario Etológico y Mapa Mental de Razas Caninas" />

    <meta name="author" content="AtlasCanino" />

  <body>
    <div id="root">
      <div id="initial-loader" role="status" aria-live="polite">
